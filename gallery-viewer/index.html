    <title>Gallery Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/context-menu.css">
    <link rel="stylesheet" href="css/confirm-dialog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<body>
    <div id="hint">
        <div class="intro-aurora">
            <div class="aurora-orb aurora-orb-1"></div>
            <div class="aurora-orb aurora-orb-2"></div>
            <div class="aurora-orb aurora-orb-3"></div>
        </div>
        <div class="intro-content">
            <div class="intro-icon-wrap">
                <i class="fas fa-images"></i>
                <div class="intro-icon-ring"></div>
            </div>
            <h1>Gallery Viewer</h1>
            <p class="intro-tagline">Browse, preview &amp; organize — entirely on your device</p>
            <button type="button" class="intro-cta">
                <i class="fas fa-folder-open"></i>
                <span>Open folder</span>
                <div class="intro-cta-shine"></div>
            </button>
            <div class="features">
                <div class="feature">
                    <i class="fas fa-folder-tree"></i>
                    <span>Folder tree</span>
                </div>
                <div class="feature">
                    <i class="fas fa-image"></i>
                    <span>Thumbnail cache</span>
                </div>
                <div class="feature">
                    <i class="fas fa-info-circle"></i>
                    <span>EXIF &amp; tags</span>
                </div>
                <div class="feature">
                    <i class="fas fa-arrows-up-down-left-right"></i>
                    <span>Drag &amp; drop</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar: folder tree -->
    <div id="sidebar">
        <div id="sidebar-content">
            <div class="sidebar-header">
                <h3><i class="fas fa-folder-tree"></i> Folders</h3>
                <button id="pinSidebarBtn" title="Pin sidebar"><i class="fas fa-thumbtack"></i></button>
            </div>

            <div id="virtualContainer">
                <ul id="virtualTreeRoot"></ul>
            </div>

            <div class="separator-line"></div>

            <div id="folderContainer">
                <ul id="folderTreeRoot"></ul>
            </div>

        </div>

        <div id="resize-helper"></div>
    </div>

    <!-- Floating sidebar toggle (visible after a folder is opened) -->
    <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle folder tree" aria-label="Toggle folder tree">
        <i class="fas fa-folder-tree"></i>
    </button>

    <!-- Floating settings control -->
    <div class="settings-btn" id="settingBtn">
        <i class="fas fa-cog"></i>
    </div>

    <!-- Filter bar -->
    <div class="filter-container">
        <input type="text" id="searchInput" placeholder="Search file name...">
        <div class="filter-count" id="filterCount">
            <span id="filteredCount">0</span>/<span id="totalCount">0</span>
        </div>
    </div>

    <div class="main-content-wrapper">
        <div class="container">
            <!-- Settings drawer -->
            <div id="settingBar" class="settings-modal">
                <div class="settings-header">
                    <h3><i class="fas fa-sliders-h"></i> Settings</h3>
                    <div class="drag-handle">
                        <i class="fas fa-arrows-alt"></i>
                    </div>
                </div>
                <div class="settings-body">

                    <div class="setting-item">
                        <label>Current folder:</label>
                        <span id="currentPathDisplay" style="word-break: break-all; font-size: 12px;">Not selected</span>
                    </div>

                    <div class="separator"></div>

                    <div class="setting-item">
                        <label for="sortSelect">Sort by: </label>
                        <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                            <select id="sortSelect" style="flex: 1;">
                                <option value="name">File name</option>
                                <option value="size">File size</option>
                                <option value="date">Modification date</option>
                            </select>
                            <button id="sortToggleBtn" class="btn-small">
                                <i class="fas fa-arrow-down-short-wide"></i>
                            </button>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label for="colCountSlider">Columns</label>
                        <input type="range" id="colCountSlider" min="1" max="10" value="5" step="1">
                        <span id="colCountValue">5 columns</span>
                    </div>

                    <div class="setting-item">
                        <label for="thumbSizeSlider">Thumbnail size</label>
                        <input type="range" id="thumbSizeSlider" min="100" max="1000" value="400" step="50">
                        <span id="thumbSizeValue">400px</span>
                    </div>

                    <div class="setting-item">
                        <label id="scrollZoneLabel" for="scrollSpeedSlider"
                            style="cursor: pointer; align-items: center; user-select: none;">
                            Edge scroll <i id="scrollZoneIcon" class="fas fa-toggle-on"></i>
                        </label>
                        <input type="range" id="scrollSpeedSlider" min="0.5" max="5" value="2" step="0.1">
                        <span id="scrollSpeedValue">2.0</span>
                    </div>

                    <div class="separator"></div>

                    <div class="setting-item info-item">
                        <label>Storage / cache:</label>
                        <span id="storageInfoValue" class="info-value">Calculating...</span>
                    </div>

                    <div class="setting-item button-group">
                        <button id="refreshBtn" class="btn-block warning" title="Rescan the folder tree from disk">Rescan folders</button>
                        <button id="clearCurrentBtn" class="btn-block warning" title="Drop cached thumbnails for the current view and redraw">Redraw current view</button>
                        <button id="cleanOldBtn" class="btn-block danger" title="Remove thumbnail cache entries not accessed for 20 days or more">Clear old cache</button>
                        <button id="clearAllBtn" class="btn-block danger" title="Delete all thumbnail cache entries">Clear all cache</button>
                    </div>

                </div>
            </div>

            <div id="galleryContainer" class="gallery-container">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <img id="modalImage" draggable="false" alt="Full view">
        </div>
        <div id="modalLoader" class="loader hidden"><i class="fas fa-spinner fa-spin"></i></div>
    </div>

    <!-- File properties modal -->
    <div id="propertiesModal" class="modal hidden">
        <div class="modal-content properties-content">
            <div class="props-header">
                <h3>Properties</h3>
                <button class="close-props-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="props-body" id="propsBodyContent">
                <!-- Dynamically generate content -->
            </div>
        </div>
    </div>

    <!-- Edge scroll zones -->
    <div id="topScrollZone" class="scrollZone top-scroll-zone"></div>
    <div id="bottomScrollZone" class="scrollZone bottom-scroll-zone"></div>

    <!-- Hidden file input -->
    <input type="file" id="folderInput" webkitdirectory multiple style="display: none;">
    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script src="js/browser-compatibility.js"></script>
    <script src="js/file-types.js"></script>
    <script src="js/state.js"></script>
    <script src="js/model.SmartFile.js"></script>
    <script src="js/model.TreeNode.js"></script>
    <script src="js/model.SmartFolder.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/db.js"></script>
    <script src="js/thumbnail-strategies.js"></script>
    <script src="js/thumbnails.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/context-menu-manager.js"></script>
    <script src="js/confirm-dialog.js"></script>
    <script src="js/operation-history.js"></script>
    <script src="js/audio-player.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/recovery.js"></script>
    <script src="js/filesystem.js"></script>
    <script src="js/id3-parser.js"></script>
    <script src="js/metadata-strategies.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/scrollzone.js"></script>
    <script src="js/events.js"></script>
    <script src="js/main.js"></script>
    <noscript>
        <div
            style="position: fixed; top: 0; left: 0; right: 0; background: #e74c3c; color: white; padding: 10px; text-align: center; z-index: 9999;">
            JavaScript is disabled. Enable JavaScript for full functionality.
        </div>
    </noscript>
</body>

</html>
